# Bela experiment configuration

app.input_file = funk-soul-guitar-clean-4_90bpm_G.wav
app.output_file = distorted5.wav
app.write_output_file = false
app.write_audio_to_outputs = false
app.clip_output = false
app.input_gain = 1.0
app.output_gain = 1.0

bench.enabled = true
bench.write_csv = true
bench.sample_system_cpu = false
bench.record_per_block_rows = true
bench.csv_file = bench.csv
bench.warmup_blocks = 100
bench.cpu_sample_every_blocks = 100

# Run the complete comparison table in one Bela session. Each case writes a
# separate CSV named results/sweep_<case>.csv. Set sweep.enabled = false to
# run the single experiment configured below instead.
sweep.enabled = true
sweep.csv_prefix = results/chunk_sweep

runtime.stop_when_input_ends = true
runtime.zero_unused_output_channels = true

# Options:
# experiment.execution_mode = fused_streaming | layered_block
# experiment.history_mode = shift | circular
# experiment.scratch_mode = persistent | per_chunk
# Use persistent on Bela's real-time audio thread. per_chunk allocates during render()
# and is useful only as a deliberately naive/offline stress case.
# experiment.inference_chunk_frames = 0 means callback-sized processing
experiment.execution_mode = layered_block
experiment.history_mode = shift
experiment.scratch_mode = persistent
experiment.inference_chunk_frames = 0
